<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: "Microsoft YaHei","PingFang SC",-apple-system,Segoe UI,Roboto,sans-serif;
    background:#fff;
    color:#222;
    min-height:100vh;
  }

  #gate {
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
  }
  #gate.hidden, .hidden { display:none !important; }
  .gate-card {
    width:min(92vw,380px); padding:36px 30px;
    background:#fff;
    border:1px solid #d9d9d9;
    border-radius:6px;
    text-align:center;
  }
  .gate-card h1 { font-size:20px; margin-bottom:8px; color:#333; }
  .gate-card p.sub { font-size:13px; color:#777; margin-bottom:22px; }
  .gate-card label { display:block; text-align:left; font-size:13px; color:#555; margin-bottom:6px; }
  .gate-card input {
    width:100%; padding:10px 12px; font-size:14px;
    background:#fff;
    border:1px solid #bbb; border-radius:4px;
    color:#222; outline:none;
  }
  .gate-card input:focus { border-color:#888; }
  .gate-card input::placeholder { color:#999; }
  .gate-card .btn {
    width:100%; margin-top:18px; padding:10px; font-size:14px;
    background:#f2f2f2; color:#222;
    border:1px solid #ccc; border-radius:4px;
    cursor:pointer;
  }
  .gate-card .err { min-height:18px; margin-top:12px; font-size:13px; color:#c00; }
  .gate-card .hint { margin-top:6px; font-size:12px; color:#999; }

  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; background:#fafafa;
    border-bottom:1px solid #e0e0e0;
  }
  header .brand .t { font-size:16px; font-weight:bold; color:#333; }
  header .stats { font-size:13px; color:#666; }
  header .out {
    padding:7px 16px; font-size:13px; color:#333;
    background:#f2f2f2; border:1px solid #ccc; border-radius:4px; cursor:pointer;
  }

  main { max-width:1000px; margin:0 auto; padding:26px 20px 50px; }

  #fileList { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .file-card {
    display:flex; align-items:center; gap:12px;
    padding:14px; background:#fff;
    border:1px solid #ddd; border-radius:6px;
  }
  .file-card .icon {
    width:38px; height:38px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; color:#666;
    background:#f2f2f2; border-radius:4px;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .file-card .meta { flex:1; min-width:0; }
  .file-card .meta .name { font-size:14px; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-card .meta .size { font-size:12px; color:#888; margin-top:2px; }
  .file-card a.dl {
    flex:none; padding:8px 16px; font-size:13px; color:#333;
    background:#f2f2f2; border:1px solid #ccc; border-radius:4px;
    text-decoration:none;
  }

  #empty {
    display:none; text-align:center; padding:50px 20px; color:#888;
    background:#fafafa; border:1px dashed #ccc; border-radius:6px;
  }
  #empty.show { display:block; }
  #empty .big { font-size:40px; margin-bottom:12px; }
  #loading { text-align:center; padding:50px; color:#888; }

  footer { text-align:center; padding:20px; font-size:12px; color:#aaa; }
  @media (max-width:560px){ main{padding:14px 12px 36px;} header{padding:12px 14px;} }
</style>
</head>
<body>

<!-- 密钥验证 -->
<div id="gate">
  <div class="gate-card">
    <h1>下载</h1>
    <p class="sub">请输入访问密钥</p>
    <form id="keyForm">
      <label for="keyInput">访问密钥</label>
      <input type="password" id="keyInput" placeholder="请输入密钥" autocomplete="off" autofocus>
      <button type="submit" class="btn">确定</button>
    </form>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <header>
    <div class="brand">
      <div class="t">下载</div>
    </div>
    <div class="stats" id="stats"></div>
    <button class="out" id="logout">退出</button>
  </header>
  <main>
    <div id="loading">正在加载…</div>
    <div id="fileList"></div>
    <div id="empty"><div class="big">📂</div><div>app 文件夹暂无可下载文件</div><div style="margin-top:10px;font-size:13px">请把文件放入 app 文件夹后运行 regenerate.ps1</div></div>
  </main>
  <footer>下载</footer>
</div>

<script src="files.js"></script>
<script>

function sha256(ascii){
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a));}
  var mathPow=Math.pow,maxWord=mathPow(2,32),result='';
  var words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length;
  var isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate){isComposite[i]=candidate;}
      hash[primeCounter]=mathPow(candidate,.5)*maxWord|0;
      k[primeCounter++]=mathPow(candidate,1/3)*maxWord|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=(asciiBitLength);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]
        +(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        +((e&hash[5])^((~e)&hash[6]))
        +k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]
          +(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))
          +w[i-7]
          +(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))
        +((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0;}
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(8*j))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  }
  return result;
}

const ACCEPTED_HASHES = [
  'a8ada454547ccedc794bf22246a0b5c9d6e988fb9e48b3afdc6fc60ed231ae25',
  '6d1a9332f5f6c04b609c193bfb62d403c29b57abbc83e8fba7ddc9aaee7de299',
  'fdc3a41a18fdf596a950f5db316970bf903d3f27f9c2614065fcb2b5bd51a470' 
];

function verifyKey(key){
  var h = sha256(String(key).trim());
  return ACCEPTED_HASHES.indexOf(h) !== -1;
}

const $gate=document.getElementById('gate');
const $app=document.getElementById('app');
const $err=document.getElementById('gateErr');

document.getElementById('keyForm').addEventListener('submit',function(e){
  e.preventDefault();
  var key=document.getElementById('keyInput').value;
  if(verifyKey(key)){
    localStorage.setItem('dl_verified','1');
    enterApp();
  }else{
    $err.textContent='密钥错误，请重试';
    document.getElementById('keyInput').select();
  }
});
document.getElementById('keyInput').addEventListener('input',function(){$err.textContent='';});
document.getElementById('logout').addEventListener('click',function(){
  localStorage.removeItem('dl_verified');
  location.reload();
});

function enterApp(){
  $gate.classList.add('hidden');
  $app.classList.remove('hidden');
  loadFiles();
}

if(localStorage.getItem('dl_verified')==='1'){ enterApp(); }

function formatSize(b){
  if(b>=1024*1024*1024) return (b/1073741824).toFixed(2)+' GB';
  if(b>=1024*1024) return (b/1048576).toFixed(2)+' MB';
  if(b>=1024) return (b/1024).toFixed(1)+' KB';
  return b+' B';
}

function fileExt(name){
  var i=name.lastIndexOf('.');
  return i>0 ? name.slice(i+1) : '文件';
}

function renderFiles(list){
  document.getElementById('loading').style.display='none';
  var box=document.getElementById('fileList');
  var total=0;
  list.forEach(function(f){ total+=f.size||0; });
  document.getElementById('stats').textContent=list.length+' 个文件 · 共 '+formatSize(total);
  if(!list.length){ document.getElementById('empty').classList.add('show'); return; }
  box.innerHTML=list.map(function(f){
    return '<div class="file-card">'
      +'<div class="icon">'+fileExt(f.name)+'</div>'
      +'<div class="meta"><div class="name" title="'+f.name+'">'+f.name+'</div>'
      +'<div class="size">'+formatSize(f.size)+'</div></div>'
      +'<a class="dl" href="'+f.url+'" download>下载</a>'
      +'</div>';
  }).join('');
}

function loadFiles(){

  var list = window.__FILES__;
  if(list && Object.prototype.toString.call(list)==='[object Array]'){
    renderFiles(list);
    return;
  }

  fetch('files.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(renderFiles)
    .catch(function(e){
      document.getElementById('loading').style.display='none';
      document.getElementById('empty').innerHTML='<div class="big">⚠</div><div>无法读取文件清单（'+e.message+'）</div>'
        +'<div style="margin-top:10px;font-size:13px">error</div>';
      document.getElementById('empty').classList.add('show');
    });
}
</script>
</body>
</html>
